version: '3.8'

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: kavach_postgres
    restart: always
    environment:
      POSTGRES_DB: kavach_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kavach_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kavach_backend
    restart: always
    environment:
      ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kavach_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_password_change_me
      JWT_SECRET_KEY: kavach_default_secret_key_please_set_in_env
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- React Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kavach_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
